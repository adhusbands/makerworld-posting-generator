name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name MakerWorldPostingGenerator makerworld_posting_generator.py

      # Always upload as a build artifact (visible on every push, requires
      # a GitHub sign-in to download, expires after 90 days).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldPostingGenerator-windows
          path: dist/MakerWorldPostingGenerator.exe

      # When you publish a Release (tag starting with "v"), also attach the
      # exe to that Release page as a permanent, no-login-required download.
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MakerWorldPostingGenerator.exe
