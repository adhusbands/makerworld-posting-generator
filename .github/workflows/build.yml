name: Build Windows + macOS Apps

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # --- Windows build: single-file .exe ---
      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name MakerWorldPostingGenerator-windows makerworld_posting_generator.py

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldPostingGenerator-windows
          path: dist/MakerWorldPostingGenerator-windows.exe

      - name: Attach Windows exe to Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MakerWorldPostingGenerator-windows.exe

      # --- macOS build: .app bundle, zipped for distribution ---
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name MakerWorldPostingGenerator-macos makerworld_posting_generator.py

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r MakerWorldPostingGenerator-macos.zip MakerWorldPostingGenerator-macos.app

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldPostingGenerator-macos
          path: dist/MakerWorldPostingGenerator-macos.zip

      - name: Attach macOS app to Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MakerWorldPostingGenerator-macos.zip
